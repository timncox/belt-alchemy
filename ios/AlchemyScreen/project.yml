# XcodeGen spec for the Alchemy Screen app, so it can be archived and sent
# to TestFlight. Same sources as ../AlchemyScreen.swiftpm (which stays for
# Swift Playgrounds). Generate the project with testflight.sh, or:
#   BUNDLE_ID=com.yourname.alchemyscreen TEAM_ID=ABCDE12345 xcodegen generate
name: AlchemyScreen
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  AlchemyLink:
    path: ../AlchemyLink
targets:
  AlchemyScreen:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: ../AlchemyScreen.swiftpm/Sources
        name: Sources
      - path: Resources
    dependencies:
      - package: AlchemyLink
      # The AUv3 extension, embedded in the app (PlugIns/AlchemyAU.appex).
      - target: AlchemyAU
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Alchemy Screen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: The mic can move the module's knobs by how loud it is and the note you sing.
        NSBluetoothAlwaysUsageDescription: Bluetooth connects to the MIDI adapters on your Alchemy Labs.
        NSMotionUsageDescription: Tilting and turning the phone can move the module's knobs, when you switch it on.
        # The app uses no encryption (CRC checks only), so no export
        # compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DEVELOPMENT_TEAM: ${TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"

  # The AUv3 MIDI processor ('aumi') that AUM, Loopy Pro and other hosts
  # load: the modules' knobs as automatable parameters, MIDI passed through
  # and CCs mapped onto them. Sources in ../AlchemyAU; see ../PLAN.md, "AUv3".
  AlchemyAU:
    type: app-extension
    platform: iOS
    sources:
      - path: ../AlchemyAU/Sources
        name: AlchemyAU
    dependencies:
      - package: AlchemyLink
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudioKit.framework
      - sdk: CoreMIDI.framework
    info:
      path: ../AlchemyAU/Info.plist
      properties:
        CFBundleDisplayName: Alchemy Screen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AlchemyAUViewController
          NSExtensionAttributes:
            AudioComponents:
              - name: "Alchemy Lab: Alchemy Screen"
                description: Alchemy Screen
                manufacturer: Alch
                type: aumi
                subtype: AlSc
                # 0x00010000 = 1.0.0. Raise it when the parameters change, so
                # hosts drop their cached copy.
                version: 65536
                sandboxSafe: true
                tags:
                  - Effects
                  - MIDI
    settings:
      base:
        # Must sit under the app's bundle ID for the app to embed it.
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.AlchemyAU
        PRODUCT_NAME: AlchemyAU
        DEVELOPMENT_TEAM: ${TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        # Keep in step with the app's: the same version and build, or App Store Connect
        # rejects the upload (testflight.sh passes CURRENT_PROJECT_VERSION
        # to every target).
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_VERSION: "5.0"

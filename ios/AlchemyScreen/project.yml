# XcodeGen spec for the Alchemy Screen app, so it can be archived and sent
# to TestFlight. Same sources as ../AlchemyScreen.swiftpm (which stays for
# Swift Playgrounds). Generate the project with testflight.sh, or:
#   BUNDLE_ID=com.yourname.alchemyscreen TEAM_ID=ABCDE12345 xcodegen generate
name: AlchemyScreen
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  AlchemyLink:
    path: ../AlchemyLink
targets:
  AlchemyScreen:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: ../AlchemyScreen.swiftpm/Sources
        name: Sources
      - path: Resources
    dependencies:
      - package: AlchemyLink
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Alchemy Screen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The app uses no encryption (CRC checks only), so no export
        # compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DEVELOPMENT_TEAM: ${TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
